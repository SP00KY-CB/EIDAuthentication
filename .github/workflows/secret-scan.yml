name: Secret scanning

# Five independent secret scanners over the full git history. They overlap on
# purpose: each has its own rule set and false-positive filtering, so a secret
# one misses another may catch. Any finding fails its job.
#
#   Gitleaks       rule-based, full history   (.gitleaksignore: reviewed false positives)
#   TruffleHog     700+ detectors, checks whether a found credential is live
#   Kingfisher     MongoDB's scanner, 485+ rules with live validation
#   2MS            Checkmarx "Too Many Secrets"
#   detect-secrets Yelp's entropy + plugin scanner (DETECT_SECRETS_EXCLUDE: reviewed known strings)
#
# Tool binaries are fetched from each project's GitHub release at a fixed
# version and checked against a SHA-256 recorded here, so a replaced release
# asset fails the job instead of running. To upgrade a tool, bump its version
# and hash together. Gitleaks, Kingfisher and 2MS also upload SARIF to the
# repository's code scanning alerts.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '41 5 * * 2'   # Tuesdays: picks up new detector rules against old history
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-scan-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      GITLEAKS_VERSION: 8.30.1
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Gitleaks
        run: |
          asset="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$asset" "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/$asset"
          echo "$GITLEAKS_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" gitleaks

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose \
            --report-format sarif --report-path gitleaks.sarif .

      - name: Upload SARIF
        if: always() && hashFiles('gitleaks.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          sarif_file: gitleaks.sarif
          category: gitleaks

  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TRUFFLEHOG_VERSION: 3.97.9
      TRUFFLEHOG_SHA256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog
        run: |
          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$RUNNER_TEMP/$asset" "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/$asset"
          echo "$TRUFFLEHOG_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" trufflehog

      # Only verified (live) and unknown (verification errored) results fail
      # the job; unverified pattern matches such as the Snyk project UUID in
      # README.md are not reported.
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/trufflehog" git "file://$PWD" \
            --results=verified,unknown --fail --no-update --github-actions

  kingfisher:
    name: Kingfisher
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    env:
      KINGFISHER_VERSION: 2.8.0
      KINGFISHER_SHA256: dfc59a8962c3b7c1365e35ba161012a7b0e2f06be95f225a5153ae2abd71cf39
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Kingfisher
        run: |
          asset=kingfisher-linux-x64.tgz
          curl -sSfL -o "$RUNNER_TEMP/$asset" "https://github.com/mongodb/kingfisher/releases/download/v${KINGFISHER_VERSION}/$asset"
          echo "$KINGFISHER_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" kingfisher

      # Exit code 200 = findings, 205 = findings validated as live.
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/kingfisher" scan . --no-update-check --redact \
            --format sarif --output kingfisher.sarif

      - name: Upload SARIF
        if: always() && hashFiles('kingfisher.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          sarif_file: kingfisher.sarif
          category: kingfisher

  two-ms:
    name: 2MS
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write
    env:
      TWOMS_VERSION: 5.4.0
      TWOMS_SHA256: 5c8a94a53cd6f811b85e19f7d2ceae555355813e954b6ae5697d579ba92319dc
      # Reviewed false positives (result ids): the same two deleted
      # placeholder examples .gitleaksignore lists, seen in two commits each.
      TWOMS_IGNORE: >-
        0975e526ea411ed14d1ddfd4edcc90342a51b32e,8837d2846561a1b35b1b95f8bab93e5dac2a597f,8bdce1099a4244db56e4d6e8ebe0194a5ce351c4,8e70608916c3156937d6ca8f977c85d0b7db9c6e
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install 2MS
        run: |
          curl -sSfL -o "$RUNNER_TEMP/2ms.zip" "https://github.com/checkmarx/2ms/releases/download/v${TWOMS_VERSION}/linux-amd64.zip"
          echo "$TWOMS_SHA256  $RUNNER_TEMP/2ms.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/2ms.zip" 2ms -d "$RUNNER_TEMP"
          chmod +x "$RUNNER_TEMP/2ms"

      - name: Scan full history
        run: |
          "$RUNNER_TEMP/2ms" git . --log-level warn \
            --ignore-result "$TWOMS_IGNORE" --report-path 2ms.sarif

      - name: Upload SARIF
        if: always() && hashFiles('2ms.sarif') != ''
        uses: github/codeql-action/upload-sarif@e4fba868fa4b1b91e1fdab776edc8cfbe6e9fb81  # v4
        with:
          sarif_file: 2ms.sarif
          category: 2ms

  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Reviewed high-entropy lines that are not secrets: the Windows
      # Common-Controls publicKeyToken, the installer's reg.exe registry
      # paths, and the SHA-256 pins in Stage-Minidrivers.ps1 and this file.
      # (A .secrets.baseline would store hashes of these strings, which the
      # other scanners then report as secrets.)
      DETECT_SECRETS_EXCLUDE: >-
        publicKeyToken|reg\.exe" (export|copy|import)|Sha256 = '[0-9A-Fa-f]{64}'|_SHA256:
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: |
          python3 -m venv "$RUNNER_TEMP/ds"
          "$RUNNER_TEMP/ds/bin/pip" install --quiet --require-hashes --no-deps \
            -r .github/requirements/detect-secrets.txt

      # Tracked files only. To clear a reviewed false positive, add a narrow
      # pattern to DETECT_SECRETS_EXCLUDE or a `pragma: allowlist secret`
      # comment on the line.
      - name: Scan tracked files
        run: |
          git ls-files -z | xargs -0 "$RUNNER_TEMP/ds/bin/detect-secrets-hook" --exclude-lines "$DETECT_SECRETS_EXCLUDE"
