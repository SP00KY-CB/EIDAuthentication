name: Aikido Badges

# Publishes a shields.io endpoint JSON for the README's Aikido Security badge:
# open issue counts by severity for the default branch.
#
# Counts come from Aikido's CI integration (@aikidosec/ci-api-client
# scan-release --json), authenticated with a CI token from
# Settings -> Integrations -> Continuous Integration, stored as the
# AIKIDO_CI_API_KEY secret. The public issue-counts API this used before
# returns 402 on the current plan.
#
# The JSON is force-pushed to an orphan `badges` branch that the README reads
# via raw.githubusercontent.com. Runs on push-to-main, daily, and on demand.
# On a pull request that edits this file it does a dry run against the base
# commit - scans and prints the result - without publishing anything.
on:
  push:
    branches: [main]
  schedule:
    - cron: '17 6 * * *'   # daily refresh even without pushes
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/aikido-badges.yml'

permissions: {}

jobs:
  badges:
    name: Publish Aikido badge JSON
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write   # force-push generated JSON to the badges branch
    steps:
      - name: Scan the default branch with Aikido
        env:
          AIKIDO_CI_API_KEY: ${{ secrets.AIKIDO_CI_API_KEY }}
          # The Git provider's numeric repository id: survives repository renames.
          REPO_ID: ${{ github.repository_id }}
          # A dry run on a PR scans the base commit, which is on the default
          # branch - the same kind of commit the published badge describes.
          COMMIT: ${{ github.event.pull_request.base.sha || github.sha }}
        run: |
          # GitHub runs steps with bash -e; a non-zero exit from the client is
          # expected here and must not abort the step before it is handled.
          set +e -uo pipefail
          mkdir -p out
          if [ -z "${AIKIDO_CI_API_KEY}" ]; then
            echo "::warning::AIKIDO_CI_API_KEY is not set"
            echo '{}' > out/scan.json
            exit 0
          fi
          # Exit codes: 0 = no open issues, 10 = open issues found (both carry
          # the JSON result), 1 = scan unavailable. None of them may fail the
          # job - the badge reports "unavailable" instead.
          npx --yes @aikidosec/ci-api-client@1.0.19 scan-release "$REPO_ID" "$COMMIT" \
            --apikey "$AIKIDO_CI_API_KEY" --json \
            --fail-on-sast-scan --fail-on-iac-scan --fail-on-secrets-scan \
            --minimum-severity-level LOW > out/scan.raw 2> out/scan.err
          echo "aikido-api-client exit code: $?"
          sed -n '/^{/,$p' out/scan.raw > out/scan.json
          [ -s out/scan.json ] || echo '{}' > out/scan.json
          if [ -s out/scan.err ]; then
            echo "--- stderr ---"; cat out/scan.err
          fi

      - name: Build badge JSON
        run: |
          node - <<'EOF'
          const fs = require('fs');
          let message = 'unavailable', color = 'lightgrey';
          try {
            const scan = JSON.parse(fs.readFileSync('out/scan.json', 'utf8'));
            const breakdown = scan.issue_breakdown;
            if (!breakdown) throw new Error('no issue_breakdown in scan result');
            const t = { critical: 0, high: 0, medium: 0, low: 0 };
            for (const category of Object.values(breakdown)) {
              for (const sev of Object.keys(t)) t[sev] += Number(category?.[sev]) || 0;
            }
            const parts = Object.entries(t).filter(([, n]) => n).map(([s, n]) => `${n} ${s}`);
            if (!parts.length) {
              message = 'no open issues'; color = 'brightgreen';
            } else {
              message = parts.join(' · ');
              color = (t.critical + t.high) ? 'red' : t.medium ? 'orange' : 'yellow';
            }
          } catch (e) {
            console.log(`::warning::aikido badge: ${e.message}`);
          }
          const badge = { schemaVersion: 1, label: 'Aikido Security', message, color };
          fs.writeFileSync('out/aikido-security.json', JSON.stringify(badge));
          console.log(JSON.stringify(badge));
          EOF
          rm -f out/scan.raw out/scan.err out/scan.json

      - name: Force-push JSON to the badges branch
        if: github.event_name != 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cd out
          git init -q -b badges
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .
          git commit -qm "chore(badges): refresh Aikido status [skip ci]"
          git push -f "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" badges
