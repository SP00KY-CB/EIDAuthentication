name: detect-secrets

# detect-secrets (Yelp): entropy and plugin-based secret scanner over the
# tracked files. Reviewed false positives are excluded through
# DETECT_SECRETS_EXCLUDE.
#
# One of five overlapping secret scanners, each in its own workflow so the
# README shows a status badge per tool: secret-gitleaks.yml,
# secret-trufflehog.yml, secret-kingfisher.yml, secret-2ms.yml and
# secret-detect-secrets.yml. Any finding fails the job.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '49 5 * * 2'   # Tuesdays: picks up new detector rules against old history
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-detect-secrets-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  detect-secrets:
    name: detect-secrets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    env:
      # Reviewed high-entropy lines that are not secrets: the Windows
      # Common-Controls publicKeyToken, the installer's reg.exe registry
      # paths, and the SHA-256 pins in Stage-Minidrivers.ps1 and the
      # secret-*.yml workflows.
      # (A .secrets.baseline would store hashes of these strings, which the
      # other scanners then report as secrets.)
      DETECT_SECRETS_EXCLUDE: >-
        publicKeyToken|reg\.exe" (export|copy|import)|Sha256 = '[0-9A-Fa-f]{64}'|_SHA256:
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false

      - name: Install detect-secrets
        run: |
          python3 -m venv "$RUNNER_TEMP/ds"
          "$RUNNER_TEMP/ds/bin/pip" install --quiet --require-hashes --no-deps \
            -r .github/requirements/detect-secrets.txt

      # Tracked files only. To clear a reviewed false positive, add a narrow
      # pattern to DETECT_SECRETS_EXCLUDE or a `pragma: allowlist secret`
      # comment on the line.
      - name: Scan tracked files
        run: |
          git ls-files -z | xargs -0 "$RUNNER_TEMP/ds/bin/detect-secrets-hook" --exclude-lines "$DETECT_SECRETS_EXCLUDE"
