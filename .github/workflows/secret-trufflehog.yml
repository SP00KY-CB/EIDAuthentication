name: TruffleHog

# TruffleHog: 700+ credential detectors over the full git history. A
# finding fails the job only when the credential is verified live, or its
# verification errored.
#
# One of six overlapping secret scanners, each in its own workflow so the
# README shows a status badge per tool: secret-gitleaks.yml,
# secret-trufflehog.yml, secret-kingfisher.yml, secret-2ms.yml,
# secret-detect-secrets.yml and secret-gitguardian.yml. Any finding fails
# the job.
#
# The tool binary is fetched from the project's GitHub release at a fixed
# version and checked against the SHA-256 recorded below, so a replaced
# release asset fails the job instead of running. To upgrade, bump the
# version and hash together.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '43 5 * * 2'   # Tuesdays: picks up new detector rules against old history
  workflow_dispatch:

permissions: {}

concurrency:
  group: secret-trufflehog-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    shell: bash

jobs:
  trufflehog:
    name: TruffleHog
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    env:
      TRUFFLEHOG_VERSION: 3.97.9
      TRUFFLEHOG_SHA256: 40377e6572495412fb9ba0bc21c9401f73b72f1d2afd11b9931bc4a5ed622866
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install TruffleHog
        run: |
          asset="trufflehog_${TRUFFLEHOG_VERSION}_linux_amd64.tar.gz"
          curl --proto '=https' --tlsv1.2 -sSfL -o "$RUNNER_TEMP/$asset" "https://github.com/trufflesecurity/trufflehog/releases/download/v${TRUFFLEHOG_VERSION}/$asset"
          echo "$TRUFFLEHOG_SHA256  $RUNNER_TEMP/$asset" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/$asset" -C "$RUNNER_TEMP" trufflehog

      # Only verified (live) and unknown (verification errored) results fail
      # the job; unverified pattern matches such as the Snyk project UUID in
      # README.md are not reported.
      - name: Scan full history
        run: |
          "$RUNNER_TEMP/trufflehog" git "file://$PWD" \
            --results=verified,unknown --fail --no-update --github-actions
