name: GitGuardian

# GitGuardian ggshield: scans the commits of each push and pull request for
# secrets with GitGuardian's detectors (500+ secret types, with validity
# checks) and reports to the GitGuardian dashboard. The GitGuardian GitHub
# App separately monitors the repository; this workflow adds a CI check, so
# a leaked secret fails the push or PR that introduced it.
#
# Secret: GITGUARDIAN_API_KEY, a personal access token with the "scan" scope
# (GitGuardian dashboard > API > Personal access tokens).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions: {}

concurrency:
  group: secret-gitguardian-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ggshield:
    name: GitGuardian ggshield
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Dependabot runs do not receive Actions secrets.
    if: github.actor != 'dependabot[bot]'
    permissions:
      contents: read
    steps:
      - name: Check that the API key is configured
        env:
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
        run: |
          if [ -z "$GITGUARDIAN_API_KEY" ]; then
            echo "::error::Repository secret GITGUARDIAN_API_KEY is not set (GitGuardian dashboard > API > Personal access tokens, scope: scan)."
            exit 1
          fi

      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          fetch-depth: 0   # every commit in the push or PR is scanned
          persist-credentials: false

      - name: Scan commits
        uses: GitGuardian/ggshield-action@7f66d3be9c59a821dcf4f45ee5d929203a1a0b90  # v1.55.0
        env:
          GITHUB_PUSH_BEFORE_SHA: ${{ github.event.before }}
          GITHUB_PUSH_BASE_SHA: ${{ github.event.base }}
          GITHUB_PULL_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          GITHUB_DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
          GITGUARDIAN_API_KEY: ${{ secrets.GITGUARDIAN_API_KEY }}
