# VirusTotal Release Scan Workflow
#
# Scans release artifacts with VirusTotal when a release is published and appends a
# results table to the release notes.
#
# Requirements implemented:
# - RPT-03: Update release notes with scan links
#
# Part of Phase 43: Release Integration
name: "Release VirusTotal Scan"

on:
  release:
    types: [published]
  # Manual re-scan of an existing release. Lets the scan be re-run after a fix, or an
  # older release re-checked, without republishing it - and makes this workflow
  # testable at all, since a release event cannot otherwise be replayed.
  workflow_dispatch:
    inputs:
      tag:
        description: "Release tag to scan (e.g. v1.2.00)"
        required: true
        type: string

env:
  # How many engines must flag a file before it counts as a real detection.
  #
  # This project ships an unsigned credential provider and an LSA authentication
  # package. Code that hooks the Windows logon path looks, to a heuristic engine,
  # exactly like a credential stealer - so one or two generic hits (Trojan.Generic,
  # ML.Attribute.HighConfidence, and friends) are the expected baseline, not a
  # finding. Only a cluster of independent engines agreeing is worth acting on.
  #
  # Override per-repository with the VT_FAIL_THRESHOLD variable.
  VT_FAIL_THRESHOLD: ${{ vars.VT_FAIL_THRESHOLD || 4 }}

  # Pacing for the VirusTotal public API, which allows 4 requests per minute. Raise
  # these (or lower them, on a premium key) with the matching repository variables.
  VT_REQUEST_INTERVAL: ${{ vars.VT_REQUEST_INTERVAL || 16 }}
  VT_RETRY_INTERVAL: ${{ vars.VT_RETRY_INTERVAL || 30 }}

# Default-deny; permissions declared per-job.
permissions: {}

jobs:
  scan-release:
    name: Scan Release Artifacts
    runs-on: ubuntu-latest
    # Generous: a whole component set paced at 4 requests/minute, with freshly built
    # binaries that VirusTotal has to analyse from scratch, takes far longer than the
    # three outer assets did.
    timeout-minutes: 90
    permissions:
      contents: write  # Required to download assets and update release notes

    steps:
      - name: Checkout repository
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09  # v5
        with:
          persist-credentials: false  # release ops use GH_TOKEN, not git creds

      # The release:published event fires the moment the release is created, but the
      # artifacts are attached later by the release job in windows-ci.yaml, which has
      # to build Release x64 with NSIS first. That took ~3 minutes for v1.2.00, so
      # downloading immediately found an empty release and failed the whole run
      # ("no assets to download") without ever scanning anything.
      #
      # Wait for the asset list to become non-empty AND stop changing, so we also
      # don't scan a partially-uploaded release.
      - name: Wait for release assets to be attached
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail

          deadline=$(( SECONDS + 1800 ))   # 30 minutes
          previous=-1
          stable=0

          while [ "$SECONDS" -lt "$deadline" ]; do
            # Tolerate a transient API failure: treat an unreadable count as "not ready"
            # rather than letting an empty string reach the numeric comparison.
            count=$(gh release view "$RELEASE_TAG" --json assets --jq '.assets | length' 2>/dev/null || true)
            case "$count" in
              ''|*[!0-9]*) count=0 ;;
            esac

            if [ "$count" -gt 0 ] && [ "$count" -eq "$previous" ]; then
              stable=$(( stable + 1 ))
              # Two consecutive identical non-zero counts: the upload has settled.
              if [ "$stable" -ge 2 ]; then
                echo "Release assets settled at $count file(s)."
                exit 0
              fi
            else
              stable=0
            fi

            previous="$count"
            echo "Waiting for release assets (currently $count)..."
            sleep 20
          done

          echo "::error::Timed out after 30 minutes waiting for release assets on $RELEASE_TAG."
          exit 1

      - name: Download release assets
        env:
          GH_TOKEN: ${{ github.token }}
          # Pass untrusted event data via env, never inline into the script (avoids
          # template injection — the tag name is attacker-controllable).
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          set -euo pipefail
          gh release download "$RELEASE_TAG" --dir release-assets
          ls -la release-assets

      # Scanning only the three published assets says "something in a 12 MB blob is
      # flagged" and stops there. ~92% of EIDInstallx64.exe by size is bundled
      # third-party driver payload, so a detection on the installer says nothing about
      # whose code caused it. Unpack the archives and scan every constituent file, so a
      # hit names an actual component.
      - name: Expand archives into a per-component scan set
        run: |
          set -euo pipefail

          mkdir -p extracted scan-set

          for archive in release-assets/*.zip; do
            [ -f "$archive" ] || continue
            echo "Expanding $(basename "$archive")"
            unzip -o -q "$archive" -d "extracted/$(basename "$archive" .zip)" || \
              echo "::warning::Could not expand $(basename "$archive")"
          done

          # NSIS installers are extractable with 7z, which is present on ubuntu-latest.
          # Treated as best-effort: if the format changes, the outer assets are still
          # scanned rather than the whole run failing.
          for installer in release-assets/*.exe extracted/*/*.exe; do
            [ -f "$installer" ] || continue
            base=$(basename "$installer" .exe)
            echo "Expanding installer $(basename "$installer")"
            if ! 7z x -y -o"extracted/${base}_contents" "$installer" > /dev/null 2>&1; then
              echo "::warning::Could not expand $(basename "$installer") with 7z; it is still scanned whole."
            fi
          done

          # Deduplicate by content hash: the installer appears both as a release asset
          # and inside the zip, and NSIS emits the same plugin DLL more than once.
          # Scanning a hash twice wastes the public API's 4-requests-per-minute budget.
          : > seen-hashes.txt
          count=0
          limit=60

          while IFS= read -r -d '' found; do
            sha=$(sha256sum "$found" | cut -d' ' -f1)
            grep -qxF "$sha" seen-hashes.txt && continue
            echo "$sha" >> seen-hashes.txt

            if [ "$count" -ge "$limit" ]; then
              echo "::warning::Component limit of ${limit} reached; remaining files were NOT scanned."
              break
            fi

            # Flatten into one directory, prefixing with a short hash so that files
            # sharing a basename across archives stay distinguishable.
            cp "$found" "scan-set/$(basename "$found")__${sha:0:8}"
            count=$(( count + 1 ))
          done < <(find release-assets extracted -type f -size +0c -print0 | sort -z)

          echo "Scanning ${count} unique component(s):"
          ls -la scan-set

      # Uploads the files to VirusTotal. Left as continue-on-error because a transient
      # upload failure must not block the reporting below - the verdict is decided by
      # the threshold step, which queries VirusTotal by file hash regardless.
      - name: Scan release assets with VirusTotal
        id: virustotal-scan
        continue-on-error: true
        uses: crazy-max/ghaction-virustotal@936d8c5c00afe97d3d9a1af26d017cfdf26800a2  # v5
        with:
          vt_api_key: ${{ secrets.VT_API_KEY }}
          files: ./scan-set/*
          request_rate: 4

      # Query VirusTotal by SHA-256 for each artifact and total the engines that
      # actually flagged it. The upload action only returns analysis URLs, so without
      # this step nothing ever compares detections against a threshold.
      - name: Evaluate detections against threshold
        id: evaluate
        env:
          VT_API_KEY: ${{ secrets.VT_API_KEY }}
        run: |
          set -euo pipefail

          if [ -z "${VT_API_KEY:-}" ]; then
            echo "::warning::VT_API_KEY is not set; skipping detection analysis."
            echo "verdict=skipped" >> "$GITHUB_OUTPUT"
            echo "worst=0" >> "$GITHUB_OUTPUT"
            printf '_VirusTotal analysis skipped: no API key configured._\n' > vt-table.md
            exit 0
          fi

          threshold="$VT_FAIL_THRESHOLD"
          worst=0
          exceeded=0
          incomplete=0

          {
            printf '| Artifact | Detections | Verdict | Report |\n'
            printf '|---|---|---|---|\n'
          } > vt-table.md

          for file in scan-set/*; do
            [ -f "$file" ] || continue
            # Strip the "__<short hash>" suffix added when the scan set was flattened.
            name=$(basename "$file"); name="${name%__*}"
            sha=$(sha256sum "$file" | cut -d' ' -f1)

            # Stay inside the public API's 4 requests/minute. With a whole component set
            # rather than three assets this is the difference between a clean run and a
            # wall of 429s that would read as "analysis incomplete".
            sleep "$VT_REQUEST_INTERVAL"

            # VirusTotal may still be analysing a freshly uploaded file. A queued file
            # already has a record whose last_analysis_stats exists but is ALL ZEROS,
            # so "stats present" is not the same as "analysis finished" - accepting it
            # would report an unscanned artifact as clean. Wait until some engine has
            # actually reported, respecting the public API's 4-requests-per-minute limit.
            stats=""
            saved_response=""
            flagged=0
            total=0
            # Fewer attempts per file than when only three assets were scanned: the
            # budget is now shared across the whole component set. Anything still
            # unfinished is reported as pending and picked up by a re-run.
            for _ in $(seq 1 6); do
              response=$(curl -sS --max-time 60 \
                -H "x-apikey: ${VT_API_KEY}" \
                "https://www.virustotal.com/api/v3/files/${sha}" || true)

              candidate=$(printf '%s' "$response" | jq -c '.data.attributes.last_analysis_stats // empty')
              if [ -n "$candidate" ]; then
                malicious=$(printf '%s' "$candidate" | jq -r '.malicious // 0')
                suspicious=$(printf '%s' "$candidate" | jq -r '.suspicious // 0')
                undetected=$(printf '%s' "$candidate" | jq -r '.undetected // 0')
                harmless=$(printf '%s' "$candidate" | jq -r '.harmless // 0')
                flagged=$(( malicious + suspicious ))
                total=$(( flagged + undetected + harmless ))

                if [ "$total" -gt 0 ]; then
                  stats="$candidate"
                  # Keep the whole payload: last_analysis_results (the per-engine
                  # verdicts) rides along in the same response, so naming the engines
                  # costs no extra API calls against the 4/minute public quota.
                  saved_response="$response"
                  break
                fi
              fi

              echo "Analysis for $name not complete yet (engines reported: ${total}); waiting..."
              sleep "$VT_RETRY_INTERVAL"
            done

            # Never silently downgrade "we don't know" to "clean" - say so and let the
            # linked report be checked by hand.
            if [ -z "$stats" ]; then
              echo "::warning::VirusTotal analysis for ${name} (${sha}) did not complete in time."
              # shellcheck disable=SC2016  # Markdown backticks, not an expansion
              printf '| `%s` | _pending_ | ⏳ analysis incomplete | [report](https://www.virustotal.com/gui/file/%s) |\n' \
                "$name" "$sha" >> vt-table.md
              incomplete=1
              continue
            fi

            [ "$flagged" -gt "$worst" ] && worst="$flagged"

            if [ "$flagged" -ge "$threshold" ]; then
              exceeded=1
              verdict='❌ investigate'
            elif [ "$flagged" -gt 0 ]; then
              verdict='✅ below threshold'
            else
              verdict='✅ clean'
            fi

            echo "${name}: ${flagged}/${total} engines flagged (threshold ${threshold})"
            # shellcheck disable=SC2016  # Markdown backticks, not an expansion
            printf '| `%s` | %s / %s | %s | [report](https://www.virustotal.com/gui/file/%s) |\n' \
              "$name" "$flagged" "$total" "$verdict" "$sha" >> vt-table.md

            # Name the engines that actually flagged this artifact, and what they called
            # it. Whether a hit is generic (Trojan.Generic, ML.Attribute.HighConfidence)
            # or a specific family is the difference between heuristic noise and a real
            # finding, and a bare count cannot tell them apart.
            if [ "$flagged" -gt 0 ]; then
              engine_rows=$(printf '%s' "$saved_response" | jq -r '
                .data.attributes.last_analysis_results // {}
                | to_entries
                | map(select(.value.category == "malicious" or .value.category == "suspicious"))
                | sort_by(.key)
                | .[]
                | "| `\(.key)` | \(.value.category) | \(.value.result // "unnamed") |"
              ')

              if [ -n "$engine_rows" ]; then
                {
                  # shellcheck disable=SC2016  # Markdown backticks, not an expansion
                  printf '\n**`%s`** — flagged by %s of %s engines:\n\n' "$name" "$flagged" "$total"
                  printf '| Engine | Category | Detection name |\n'
                  printf '|---|---|---|\n'
                  printf '%s\n' "$engine_rows"
                } >> vt-detections.md

                echo "  engines flagging ${name}:"
                printf '%s\n' "$engine_rows" | sed 's/^/    /'
              fi
            fi
          done

          echo "worst=$worst" >> "$GITHUB_OUTPUT"
          if [ "$exceeded" -eq 1 ]; then
            echo "verdict=exceeded" >> "$GITHUB_OUTPUT"
          elif [ "$incomplete" -eq 1 ]; then
            # Reported distinctly from "ok" so an unfinished analysis is never mistaken
            # for a clean result. Does not fail the job - the artifact is not suspect,
            # VirusTotal just has not finished looking at it.
            echo "verdict=incomplete" >> "$GITHUB_OUTPUT"
          else
            echo "verdict=ok" >> "$GITHUB_OUTPUT"
          fi

      - name: Update release notes with scan results
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERDICT: ${{ steps.evaluate.outputs.verdict }}
          WORST: ${{ steps.evaluate.outputs.worst }}
        run: |
          set -euo pipefail

          marker='## 🔍 VirusTotal Scan Results'

          # Read the CURRENT body from the API rather than the event payload: the
          # payload is a snapshot from publish time and would silently revert any
          # edits made since (the release job attaching assets, a manual note fix).
          gh release view "$RELEASE_TAG" --json body --jq '.body' > current-notes.md

          # Drop any previous VT section so re-runs replace rather than accumulate.
          # The second pass swallows trailing blank lines and the "---" separator that
          # preceded the old section, otherwise each re-run stacks another rule.
          awk -v marker="$marker" '
            index($0, marker) == 1 { exit }
            { print }
          ' current-notes.md \
          | awk '
              /^[[:space:]]*$/    { blanks = blanks $0 "\n"; next }
              /^---[[:space:]]*$/ { rule = 1; blanks = ""; next }
              { if (!rule) printf "%s", blanks; else rule = 0; blanks = ""; print }
              END { if (!rule) printf "%s", blanks }
            ' > new-notes.md

          {
            printf '\n---\n\n%s\n\n' "$marker"

            case "${VERDICT:-unknown}" in
              exceeded)
                printf '**%s or more engines flagged an artifact — review before deploying.**\n\n' "$VT_FAIL_THRESHOLD"
                ;;
              ok)
                printf 'No artifact reached the detection threshold of %s engines.\n\n' "$VT_FAIL_THRESHOLD"
                ;;
              incomplete)
                printf 'VirusTotal had not finished analysing every artifact when this ran. '
                printf 'Rows marked _pending_ below are unknown, not clean — open the linked '
                printf 'report to check, or re-run this workflow against the tag.\n\n'
                ;;
              skipped)
                printf 'Analysis was skipped.\n\n'
                ;;
              *)
                printf 'Scan did not complete; see the workflow run for details.\n\n'
                ;;
            esac

            if [ -f vt-table.md ]; then
              cat vt-table.md
            fi

            # Per-engine breakdown, collapsed so it does not dominate the notes.
            if [ -s vt-detections.md ]; then
              printf '\n<details>\n<summary>Which engines flagged what</summary>\n'
              cat vt-detections.md
              printf '\n</details>\n'
            fi

            printf '\n_Scanned on %s_\n\n' "$(date -u '+%Y-%m-%d %H:%M:%S UTC')"
            # Single printf: splitting this across several calls put the %s in one
            # invocation and its argument in another, so the threshold rendered blank.
            printf '_This project ships an unsigned credential provider and LSA authentication package. Code on the Windows logon path routinely trips one or two heuristic engines, so isolated hits are expected. Only %s or more independent detections are treated as a signal._\n' \
              "$VT_FAIL_THRESHOLD"
          } >> new-notes.md

          gh release edit "$RELEASE_TAG" --notes-file new-notes.md

      # Decide the job outcome last, so the release notes are always updated first.
      - name: Enforce detection threshold
        if: always() && steps.evaluate.outputs.verdict == 'exceeded'
        env:
          WORST: ${{ steps.evaluate.outputs.worst }}
        run: |
          echo "::error::${WORST} VirusTotal engines flagged a release artifact (threshold ${VT_FAIL_THRESHOLD})."
          exit 1

      - name: Report results
        if: always()
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name || inputs.tag }}
          VERDICT: ${{ steps.evaluate.outputs.verdict }}
          WORST: ${{ steps.evaluate.outputs.worst }}
        run: |
          {
            echo "## Release Scan Complete"
            echo ""
            echo "Release: $RELEASE_TAG"
            echo "Highest detection count: ${WORST:-unknown} (threshold ${VT_FAIL_THRESHOLD})"
            echo "Verdict: ${VERDICT:-unknown}"
            echo ""
            if [ -f vt-table.md ]; then
              cat vt-table.md
            fi
            if [ -s vt-detections.md ]; then
              echo ""
              echo "### Which engines flagged what"
              cat vt-detections.md
            fi
          } >> "$GITHUB_STEP_SUMMARY"
